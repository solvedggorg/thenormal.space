name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Tracked secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: bash scripts/check-tracked-secrets.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: |
          bun install
          (cd api && bun install)
          (cd auth && bun install)
          (cd store && bun install)
          (cd stats && bun install)
          (cd store/backend && npm ci)
      - name: Test
        run: bun test src api/test store/src store/scripts auth/test ./stats scripts

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
      - name: Validate
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check -recursive
          terraform validate
